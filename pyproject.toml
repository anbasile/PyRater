[project]
name = "pyrater"
version = "0.1.0"
description = "A Python toolkit for annotation analysis with Bayesian models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo Basile" }]
dependencies = [
  "cmdstanpy>=1.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "arviz>=0.18,<1",
  "xarray>=2024.3",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "typer>=0.12",
  "platformdirs>=4.2",
]

[project.scripts]
pyrater = "pyrater.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "ty>=0.0.1a1",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
examples = ["sentence-transformers>=3.0", "datasets>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already includes every file under src/pyrater (not just .py),
# so .stan/.csv package data need no separate force-include -- doing both
# makes hatchling try to add the same files to the wheel twice.
packages = ["src/pyrater"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "stan: slow tests that compile and sample real Stan models (requires CmdStan)",
]

[tool.coverage.run]
source = ["src/pyrater"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
# PLR0913/PLR2004: Stan-sampling kwargs legitimately produce many-parameter
# constructors; magic-number checks are noisy for small model-dimension math.
# E741: I/J/K/N are Stan's own data-block variable names (see the .stan
# files) — keeping them ambiguous-but-consistent beats renaming away from
# the paper's and Stan's own notation.
ignore = ["PLR0913", "PLR2004", "E741"]

[tool.ty.rules]
# ty is Astral's type checker; strict by default via src layout inference.
